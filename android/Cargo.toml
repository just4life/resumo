[package]
name = "resumo"
version = "0.1.0"
edition = "2021"
description = "Simple modern video player built on libVLC"
license = "GPL-2.0-or-later"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
