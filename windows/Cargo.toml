[package]
name = "resumo"
version = "0.1.0"
edition = "2021"
description = "Simple modern video player built on libVLC"
license = "GPL-2.0-or-later"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
png = "0.18"
rfd = "0.17"
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs"] }
# The same TLS that ureq brings, used directly for the chat's WebSocket.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
